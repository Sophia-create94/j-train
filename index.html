<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A day on the J train</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #0a0807;
    min-height: 100vh;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    font-family: system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .phone-frame {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: #1F1814;
    border-radius: 14px;
    overflow: hidden;
  }

  /* The line: bleeds top to bottom, behind everything */
  .line {
    position: absolute;
    left: 28px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #B8743D;
    transform: translateX(-50%);
    z-index: 1;
  }

  /* TRAIN DOT — the signature element */
  .train-dot {
    position: absolute;
    left: 28px;
    top: 0;
    width: 13px;
    height: 13px;
    background: #EDE6DA;
    border-radius: 50%;
    box-shadow: 0 0 10px 2px rgba(184, 116, 61, 0.5);
    transform: translate(-50%, -50%);
    z-index: 5;
  }

  /* Transition only enabled after initial position is set */
  .train-dot.ready {
    transition: top 0.85s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .content {
    position: relative;
    z-index: 2;
  }

  .top-bleed     { height: 60px; }
  .bottom-bleed  { height: 120px; }

  /* STOP */
  .stop {
    position: relative;
    margin-bottom: 220px;
  }

  .stop-trigger {
    display: block;
    width: 100%;
    min-height: 35px;
    background: none;
    border: none;
    padding: 12px 0;
    margin: 0;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  .stop-trigger::-moz-focus-inner { border: 0; }
  .stop-trigger:focus { outline: none; }
  .stop-trigger:focus-visible { outline: none; }

  .bullet {
    position: absolute;
    left: 28px;
    top: 50%;
    width: 11px;
    height: 11px;
    background: #B8743D;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    transition: box-shadow 0.6s ease;
  }

  /* Active stop's bullet glow — independent from the dot's own glow */
  .stop.active .bullet {
    box-shadow: 0 0 12px 2px rgba(184, 116, 61, 0.65);
  }

  .label {
    position: absolute;
    left: 56px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #B8743D;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 3;
  }

  /* EXPANDED CONTAINER — height-animated */
  .stop-expanded {
    height: 0;
    overflow: hidden;
    transition: height 500ms cubic-bezier(0.65, 0, 0.35, 1) 100ms;
  }

  .stop.open .stop-expanded {
    transition: height 600ms cubic-bezier(0.65, 0, 0.35, 1);
  }

  /* INNER CONTENT — opacity-animated */
  .stop-content {
    padding: 40px 28px 80px 56px;
    opacity: 0;
    transition: opacity 300ms cubic-bezier(0.65, 0, 0.35, 1);
  }

  .stop.open .stop-content {
    opacity: 1;
    transition: opacity 400ms cubic-bezier(0.65, 0, 0.35, 1) 150ms;
  }

  .feeling {
    font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    font-variation-settings: "opsz" 144;
    font-weight: 400;
    font-style: normal;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.005em;
    color: #EDE6DA;
  }

  .recs { margin-top: 52px; }
  .rec + .rec { margin-top: 32px; }

  .tag {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #B8743D;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .rec-text {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.55;
    color: #EDE6DA;
  }

  .hairline {
    margin: 44px 0 0 0;
    width: 32px;
    height: 1px;
    background: #B8743D;
    opacity: 0.7;
    border: none;
  }

  .insider {
    margin-top: 24px;
    font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.55;
    color: #B6A99A;
  }

  /* BRIDGE */
  .bridge {
    position: relative;
    height: 480px;
    margin-bottom: 220px;
    --look-up-progress: 0;
  }

  /* The warm wash at the top of the bridge — the only gradient in the piece.
     Reads like light coming in from above as the train rises out of the tunnel. */
  .bridge-wash {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 140px;
    background: linear-gradient(to bottom, rgba(216, 160, 111, 0.18) 0%, rgba(216, 160, 111, 0) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Manhattan, abstracted — staggered rectangles bleeding edge to edge,
     bottom-aligned with the bridge section. Static atmosphere, no animation. */
  .bridge-skyline {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 170px;
    z-index: 1;
    display: block;
    pointer-events: none;
  }

  .bridge-skyline svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* fill-box so percentage transforms reference each element's own bounding
     box rather than the SVG viewBox. Harmless for opacity-only animations. */
  .water-line, .window-light, .water-sparkle {
    transform-box: fill-box;
    transform-origin: center;
  }

  /* WAVE DRIFT — five lines drifting at distinct durations, alternating
     directions. animation-direction: alternate gives slow ping-pong instead
     of a hard reset. Opacities nudged up from v3 so the quiet motion is
     actually legible without becoming dramatic — water should still read as
     barely moving when you first look at it. */
  .water-line-1 { fill-opacity: 0.38; animation: drift-right 19s linear infinite alternate; }
  .water-line-2 { fill-opacity: 0.26; animation: drift-left  24s linear infinite alternate; }
  .water-line-3 { fill-opacity: 0.32; animation: drift-right 27s linear infinite alternate; }
  .water-line-4 { fill-opacity: 0.20; animation: drift-left  31s linear infinite alternate; }
  .water-line-5 { fill-opacity: 0.28; animation: drift-right 35s linear infinite alternate; }

  @keyframes drift-right {
    from { transform: translateX(-25%); }
    to   { transform: translateX( 25%); }
  }
  @keyframes drift-left {
    from { transform: translateX( 25%); }
    to   { transform: translateX(-25%); }
  }

  /* WINDOW LIGHTS — five sparkle variants. The "shine" comes from asymmetric
     curves: a quick rise to a bright peak followed by a slower fade reads as
     real twinkle, where a sine-wave pulse reads as breathing. Peaks pushed
     to 0.85–0.95 so the brightest moments actually catch the eye. sparkle-d
     remains the steady anchor — gentle dip, never goes dim — but with a
     brighter base than v3 so anchors hold the eye as the steady city. */
  @keyframes sparkle-a {
    /* Quick flash, slow fade — the most "stellar" of the variants */
    0%, 100% { opacity: 0.30; }
    18%      { opacity: 0.92; }
    45%      { opacity: 0.45; }
  }
  @keyframes sparkle-b {
    /* Slow rise, sharp peak, quick fall */
    0%, 100% { opacity: 0.35; }
    55%      { opacity: 0.85; }
    68%      { opacity: 0.25; }
  }
  @keyframes sparkle-c {
    /* Double-pulse — catches light, loses it, catches again */
    0%, 100% { opacity: 0.40; }
    22%      { opacity: 0.95; }
    50%      { opacity: 0.30; }
    78%      { opacity: 0.72; }
  }
  @keyframes sparkle-d {
    /* Steady anchor — never dims, slow gentle breathing */
    0%, 100% { opacity: 0.80; }
    50%      { opacity: 0.62; }
  }
  @keyframes sparkle-e {
    /* Gentle wash — slower swell, no sharp peak */
    0%, 100% { opacity: 0.40; }
    42%      { opacity: 0.82; }
    72%      { opacity: 0.52; }
  }

  /* Each light: unique keyframe + duration + negative delay. Negative delays
     drop each animation in mid-cycle so they never start in sync on load. */
  .wl-1  { animation: sparkle-a 4.1s ease-in-out infinite -1.2s; }
  .wl-2  { animation: sparkle-b 5.7s ease-in-out infinite -0.5s; }
  .wl-3  { animation: sparkle-c 3.4s ease-in-out infinite -2.1s; }
  .wl-4  { animation: sparkle-d 6.3s ease-in-out infinite -1.8s; }
  .wl-5  { animation: sparkle-e 4.9s ease-in-out infinite -0.3s; }
  .wl-6  { animation: sparkle-a 3.2s ease-in-out infinite -2.8s; }
  .wl-7  { animation: sparkle-c 5.4s ease-in-out infinite -1.5s; }
  .wl-8  { animation: sparkle-d 6.5s ease-in-out infinite -0.8s; }
  .wl-9  { animation: sparkle-b 2.8s ease-in-out infinite -2.4s; }
  .wl-10 { animation: sparkle-a 4.6s ease-in-out infinite -1.1s; }
  .wl-11 { animation: sparkle-e 3.7s ease-in-out infinite -2.0s; }
  .wl-12 { animation: sparkle-d 5.9s ease-in-out infinite -0.6s; }
  .wl-13 { animation: sparkle-c 4.3s ease-in-out infinite -1.7s; }

  /* WATER SPARKLES — flicker to 0 (unlike windows, which only dim). Peaks
     pushed up to 0.78–0.88 so a flash on the water actually catches like real
     reflected light. The going-to-zero is what makes them feel like
     reflections rather than light sources — a real sparkle has to disappear
     to feel like a real sparkle. */
  @keyframes water-sparkle-a {
    0%, 100% { opacity: 0; }
    45%      { opacity: 0.88; }
    58%      { opacity: 0.65; }
  }
  @keyframes water-sparkle-b {
    0%, 100% { opacity: 0.32; }
    22%      { opacity: 0; }
    58%      { opacity: 0.78; }
    82%      { opacity: 0; }
  }
  @keyframes water-sparkle-c {
    /* Quick flash, brief tail, gone */
    0%, 100% { opacity: 0; }
    30%      { opacity: 0.85; }
    44%      { opacity: 0.30; }
    72%      { opacity: 0; }
  }

  .ws-1 { animation: water-sparkle-a 3.2s ease-in-out infinite -0.7s; }
  .ws-2 { animation: water-sparkle-b 4.4s ease-in-out infinite -2.1s; }
  .ws-3 { animation: water-sparkle-c 3.8s ease-in-out infinite -1.3s; }
  .ws-4 { animation: water-sparkle-a 5.1s ease-in-out infinite -0.4s; }
  .ws-5 { animation: water-sparkle-c 4.7s ease-in-out infinite -2.5s; }
  .ws-6 { animation: water-sparkle-b 3.6s ease-in-out infinite -1.9s; }
  .ws-7 { animation: water-sparkle-a 5.5s ease-in-out infinite -1.0s; }
  .ws-8 { animation: water-sparkle-c 4.1s ease-in-out infinite -2.3s; }

  .bridge-line {
    position: absolute;
    left: 28px;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #d8a06f;
    transform: translateX(-50%);
    z-index: 2;
  }

  .bridge-content {
    position: absolute;
    left: 56px;
    right: 28px;
    top: 38%;
    transform: translateY(-50%);
    z-index: 3;
  }

  .bridge-caption {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: #B6A99A;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  /* "Look up." starts 40px low and fully transparent, then rises into place
     as the bridge centers in the viewport. The transition class is added by
     JS after first paint so a page that loads scrolled mid-bridge doesn't
     replay the entrance animation — it just renders in its current state. */
  .bridge-headline {
    margin-top: 16px;
    font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    font-variation-settings: "opsz" 144;
    font-style: italic;
    font-weight: 400;
    font-size: 36px;
    line-height: 1;
    color: #EDE6DA;
    opacity: var(--look-up-progress, 0);
    transform: translateY(calc((1 - var(--look-up-progress, 0)) * 40px));
  }

  .bridge.lookup-ready .bridge-headline {
    transition: opacity 0.4s ease-out, transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .stop-chambers { margin-bottom: 80px; }

  .outro {
    padding-left: 56px;
    padding-right: 28px;
    font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.55;
    color: #B6A99A;
    margin-bottom: 80px;
  }

  .broad-bullet-row {
    position: relative;
    height: 7px;
  }

  .broad-bullet {
    position: absolute;
    left: 28px;
    top: 50%;
    width: 7px;
    height: 7px;
    background: #5a3d22;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
  }

  /* TITLE — same italic Fraunces voice as "Look up.", a step larger.
     Sits above the journey; the line keeps running behind it. */
  .title {
    padding-left: 56px;
    padding-right: 28px;
    margin-bottom: 50px;
    font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    font-variation-settings: "opsz" 144;
    font-style: italic;
    font-weight: 400;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: #EDE6DA;
  }
</style>
<style id="spots-styles">
  /* ---------- clickable spots ---------- */
  .rec {
    cursor: pointer;
    border-radius: 9px;
    margin-left: -10px;
    margin-right: -10px;
    padding: 10px;
    transition: background 0.25s ease;
  }
  .rec:hover { background: rgba(184, 116, 61, 0.06); }

  .rec-chevron {
    display: none;
    margin-left: 7px;
    font-size: 11px;
    color: #B8743D;
    opacity: 0.65;
    transition: transform 0.3s ease;
  }
  .rec-chevron { display: inline-block; }
  .rec.rec-open .rec-chevron { transform: rotate(90deg); }

  .rec-detail {
    height: 0;
    overflow: hidden;
    transition: height 360ms cubic-bezier(0.65, 0, 0.35, 1);
  }
  .rec-detail-inner {
    padding-top: 16px;
    padding-bottom: 6px;  /* keep the pill's stroke clear of the drawer's overflow clip */
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .rec-where {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    color: #B6A99A;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rec-where svg { flex: none; }
  .rec-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .rec-action {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: #EDE6DA;
    border: 1px solid rgba(184, 116, 61, 0.5);
    padding: 8px 13px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .rec-action:hover {
    background: rgba(184, 116, 61, 0.16);
    border-color: #B8743D;
  }
</style>

</head>
<body>
  <div class="phone-frame">
    <div class="line"></div>
    <div class="train-dot" aria-hidden="true"></div>

    <div class="content">
      <div class="top-bleed"></div>

      <h1 class="title">A day on the J train</h1>

      <div class="broad-bullet-row" style="margin-bottom: 30px;">
        <div class="broad-bullet" aria-hidden="true"></div>
      </div>

      <div class="stop active" data-stop="gates">
        <button class="stop-trigger" type="button" aria-expanded="false">
          <span class="bullet" aria-hidden="true"></span>
          <span class="label">GATES AV</span>
        </button>
        <div class="stop-expanded"></div>
      </div>

      <div class="stop" data-stop="marcy">
        <button class="stop-trigger" type="button" aria-expanded="false">
          <span class="bullet" aria-hidden="true"></span>
          <span class="label">MARCY AV</span>
        </button>
        <div class="stop-expanded"></div>
      </div>

      <div class="bridge">
        <div class="bridge-wash" aria-hidden="true"></div>
        <div class="bridge-skyline" id="bridgeSkyline">
          <svg viewBox="0 0 380 170" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <defs>
              <linearGradient id="skyline-haze" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#d8a06f" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#d8a06f" stop-opacity="0.32"/>
              </linearGradient>
            </defs>

            <!-- WATER (z-bottom). Drawn first so silhouette bases overlap and
                 hide the line edges where they'd otherwise meet land. -->
            <g class="skyline-water">
              <!-- Dark water surface — matches the phone frame, so the water
                   area visually merges with the rest of the dark space. The
                   bright drift lines and sparkles read as warm-white
                   reflections catching on dark river. -->
              <rect x="0" y="140" width="380" height="30" fill="#1F1814"/>

              <!-- Five thin horizontal drift lines, back to warm-white.
                   Same shapes, positions, and timing as before. -->
              <rect class="water-line water-line-1" x="124" y="144" width="133" height="1.5" fill="#EDE6DA" shape-rendering="crispEdges"/>
              <rect class="water-line water-line-2" x="95"  y="149" width="190" height="1.5" fill="#EDE6DA" shape-rendering="crispEdges"/>
              <rect class="water-line water-line-3" x="67"  y="155" width="247" height="1.5" fill="#EDE6DA" shape-rendering="crispEdges"/>
              <rect class="water-line water-line-4" x="48"  y="162" width="285" height="1.5" fill="#EDE6DA" shape-rendering="crispEdges"/>
              <rect class="water-line water-line-5" x="38"  y="167" width="304" height="1.5" fill="#EDE6DA" shape-rendering="crispEdges"/>

              <!-- Water sparkles — back to warm-white. Five #EDE6DA and two
                   #d8a06f for temperature variation. Most clustered below the
                   right (Manhattan) cluster — that's where city light would
                   actually catch on the East River. -->
              <circle class="water-sparkle ws-1" cx="190" cy="151" r="0.5"  fill="#EDE6DA"/>
              <circle class="water-sparkle ws-2" cx="225" cy="159" r="0.5"  fill="#EDE6DA"/>
              <circle class="water-sparkle ws-3" cx="258" cy="148" r="0.75" fill="#d8a06f"/>
              <circle class="water-sparkle ws-4" cx="285" cy="163" r="0.5"  fill="#EDE6DA"/>
              <circle class="water-sparkle ws-5" cx="318" cy="154" r="0.5"  fill="#EDE6DA"/>
              <circle class="water-sparkle ws-6" cx="345" cy="166" r="0.75" fill="#EDE6DA"/>
              <circle class="water-sparkle ws-7" cx="92"  cy="160" r="0.5"  fill="#d8a06f"/>
            </g>

            <!-- SILHOUETTE (z-mid). Gradient applied at group level so every
                 rect inherits the same haze fill. All flat tops — no spires,
                 no setbacks, no domes. -->
            <g class="skyline-silhouette" fill="url(#skyline-haze)">
              <!-- Left cluster: Brooklyn / Williamsburg waterfront (0-133) -->
              <rect x="0"   y="105" width="24" height="35"/>
              <rect x="24"  y="92"  width="18" height="48"/>
              <rect x="42"  y="98"  width="28" height="42"/>
              <rect x="70"  y="82"  width="22" height="58"/>
              <rect x="92"  y="95"  width="16" height="45"/>
              <rect x="108" y="88"  width="25" height="52"/>

              <!-- Center gap: East River dip (133-171) -->
              <rect x="133" y="115" width="20" height="25"/>
              <rect x="153" y="118" width="18" height="22"/>

              <!-- Right cluster: Lower Manhattan (171-380) -->
              <rect x="171" y="85"  width="22" height="55"/>
              <rect x="193" y="68"  width="18" height="72"/>
              <rect x="211" y="78"  width="15" height="62"/>
              <rect x="226" y="82"  width="20" height="58"/>
              <!-- Slim accent 1: ~65% width, 110px tall, flat top -->
              <rect x="246" y="30"  width="7"  height="110"/>
              <rect x="253" y="62"  width="22" height="78"/>
              <rect x="275" y="72"  width="24" height="68"/>
              <!-- Slim accent 2: ~79% width, 95px tall, flat top -->
              <rect x="299" y="45"  width="6"  height="95"/>
              <rect x="305" y="58"  width="18" height="82"/>
              <rect x="323" y="70"  width="22" height="70"/>
              <rect x="345" y="82"  width="35" height="58"/>
            </g>

            <!-- WINDOW LIGHTS (z-top). Each light has unique animation timing
                 so the twinkle never falls into a pattern. -->
            <g class="skyline-lights" fill="#EDE6DA">
              <!-- Right cluster — 14 lights, dense around the accent towers -->
              <circle class="window-light wl-1"  cx="250" cy="33"  r="1.25"/>
              <circle class="window-light wl-2"  cx="250" cy="55"  r="0.5"/>
              <circle class="window-light wl-3"  cx="249" cy="75"  r="0.5"/>
              <circle class="window-light wl-14" cx="248" cy="120" r="0.5"/>
              <circle class="window-light wl-4"  cx="302" cy="48"  r="1"/>
              <circle class="window-light wl-5"  cx="301" cy="70"  r="1"/>
              <circle class="window-light wl-6"  cx="302" cy="90"  r="0.5"/>
              <circle class="window-light wl-15" cx="300" cy="110" r="0.75"/>

  <script>
    // ---------- PER-STOP CONTENT ----------
    const stopContent = {
      gates: {

        recs: [
          { tag: 'COFFEE', text: 'Botani Cafe. Grab a seat outside one of the little tables and enjoy the sun and the local Bed-Stuy area. Order an iced coffee with oat milk and a pastry.' },
          { tag: 'PIZZA', text: 'Saraghina Pizzeria. Enjoy this delicious Neapolitan pizza from a wood-burning oven — one of the best in Brooklyn!' },
          { tag: 'LIVE MUSIC', text: 'LunÀtico. Eat, drink, listen — this is my absolute favorite bar in the world! Order an IPA and the hummus, and enjoy beautiful live music.' }
        ]
      },
      marcy: {
        feeling: 'My favorite spots',
        recs: [
          { tag: 'COFFEE', text: 'Devoción. They roast in Colombia and ship same-week — order an iced coffee with oat milk, it\u2019s my favorite in the world. Enjoy the beautiful interior design and skylight.' },
          { tag: 'WALK & VIEW', text: 'Domino Park. This wonderfully designed park is truly one of my favorite spots in NYC! You\u2019ll get one of the most beautiful views of the Manhattan skyline. I could stay here and look at the skyline and the shimmering water of the East River for hours.' },
          { tag: 'SHOP', text: 'LEIF. In this small home-and-gift shop, you\u2019ll find the cutest decoration — from little bowls and candles to beautifully designed greeting cards.' }
        ]
      },
      delancey: {
        feeling: 'First stops in the city',
        recs: [
          { tag: 'SPEAKEASY', text: 'The Back Room. Shhhh\u2026 my favorite speakeasy brings you back in time. Where, over 100 years ago, people secretly drank out of teacups — the same way they\u2019re served today!' },
          { tag: 'THAI FOOD', text: 'Wayla. I absolutely love Thai food! As a traveler, I\u2019ve been to Thailand, and I\u2019m happy to find authentic Thai food inspired by the markets of Bangkok in NYC!' },
          { tag: 'ROOFTOP VIEW', text: 'Mr. Purple. From the rooftop bar and lounge on the 15th floor of Hotel Indigo, you\u2019ll get a wonderful view over the most beautiful city in the world!' }
        ]
      },
      canal: {
        feeling: 'My slower afternoon',
        recs: [
          { tag: 'VEGAN FOOD', text: 'Le Botaniste. As a vegan, I love to try out new vegan food everywhere I travel! This restaurant was the first organic, plant-based, and carbon-neutral restaurant in NYC.' },
          { tag: 'GREEN OASIS', text: 'Gilligan\u2019s. This hidden gem feels like a green oasis in the concrete jungle. With so many plants and cozy lounge chairs, it feels like you\u2019re on vacation!' },
          { tag: 'SHOP', text: 'Roman and Williams Guild. With my love for design and decoration, wandering this store and looking at every detail feels like being in a museum.' }
        ]
      },
      chambers: {
        feeling: 'Last stop of the day, big views',
        recs: [
          { tag: 'ARCHITECTURE', text: 'Oculus. As an architecture lover — I hold a bachelor\u2019s in architecture, and Santiago Calatrava is my favorite architect — I love this building. It\u2019s beautiful and magical from the outside and inside, a true eye-catcher in the concrete jungle.' },
          { tag: 'REST', text: 'City Hall Park. This beautifully designed little green space with its fountain is perfect for taking a rest from the city\u2019s hustle.' },
          { tag: 'WALK & VIEW', text: 'Brooklyn Bridge entry. Walking over this bridge, it\u2019s one of those \u2018feels like a movie\u2019 experiences you can have in NYC! With amazing views of the Manhattan skyline, Brooklyn, and the East River.' }
        ]
      }
    };

    function buildCardHTML(content) {
      const recsHTML = content.recs.map(rec => `
        <div class="rec">
          <div class="tag">[&thinsp;${rec.tag}&thinsp;]</div>
          <div class="rec-text">${rec.text}</div>
        </div>
      `).join('');

      const insiderHTML = content.insider ? `
        <hr class="hairline">
        <p class="insider">${content.insider}</p>
      ` : '';

      return `
        <div class="stop-content">
          <h2 class="feeling">${content.feeling}</h2>
          <div class="recs">${recsHTML}</div>
          ${insiderHTML}
        </div>
      `;
    }

    document.querySelectorAll('.stop-expanded').forEach(el => {
      const stopId = el.parentElement.dataset.stop;
      if (stopContent[stopId]) {
        el.innerHTML = buildCardHTML(stopContent[stopId]);
      }
    });

    // ---------- REFERENCES ----------
    const stopElements = Array.from(document.querySelectorAll('.stop'));
    const trainDot = document.querySelector('.train-dot');
    const phoneFrame = document.querySelector('.phone-frame');
    const gates = document.querySelector('[data-stop="gates"]');

    // ---------- STATE ----------
    let activeStop = gates;           // gates is .active in the HTML on initial render
    let openStop = null;              // step 3 — currently expanded stop
    let isAnimating = false;          // step 3 — expand/collapse in progress
    let observerLockedUntil = 0;      // step 4 — temporary tap-priority window

    // ---------- TRAIN DOT POSITIONING ----------
    function calculateDotTop(bullet) {
      const bulletRect = bullet.getBoundingClientRect();
      const phoneRect = phoneFrame.getBoundingClientRect();
      return (bulletRect.top - phoneRect.top) + (bulletRect.height / 2);
    }

    function moveDotToStop(stop) {
      const bullet = stop.querySelector('.bullet');
      const top = calculateDotTop(bullet);
      trainDot.style.top = top + 'px';
    }

    function setActiveStop(stop) {
      if (stop !== activeStop) {
        if (activeStop) activeStop.classList.remove('active');
        activeStop = stop;
        stop.classList.add('active');
      }
      moveDotToStop(stop);
    }

    // Place the dot at Gates synchronously, before transitions are enabled.
    // This avoids any animated arrival on initial load — the dot is just there.
    moveDotToStop(activeStop);

    // Enable the top transition starting next frame, so all subsequent moves animate.
    requestAnimationFrame(() => {
      trainDot.classList.add('ready');
    });

    // The synchronous placement above runs before the web fonts load. The
    // Fraunces title is ~46px taller once its real font arrives, which shifts
    // every bullet below it and leaves the dot off Gates on first paint.
    //
    // document.fonts.ready alone isn't reliable: the @font-face rules come from
    // an external Google Fonts stylesheet, so on a cold load that sheet can
    // arrive *after* this script runs — the promise then resolves before the
    // fonts are even known, and the title reflows afterward. A ResizeObserver on
    // the title fires at the real moment its height changes (font swap, rewrap),
    // so we re-pin to the active stop exactly when the layout actually shifts.
    // Snap (transition suppressed) so it's a silent correction, not a slide.
    const repinDot = () => {
      trainDot.classList.remove('ready');
      moveDotToStop(activeStop);
      requestAnimationFrame(() => trainDot.classList.add('ready'));
    };
    if (window.ResizeObserver) {
      new ResizeObserver(repinDot).observe(document.querySelector('.title'));
    } else if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(repinDot);
    }

    // ---------- ACTIVE STOP SELECTION + SCROLL-DRIVEN OPEN ----------
    const chambers = document.querySelector('[data-stop="chambers"]');

    let autoOpenTimer = null;
    let pendingOpen;                // open-target of a scheduled swap: a stop, or null = close all; undefined = nothing pending
    let suppressAutoOpenFor = null; // a stop the user just tap-closed — don't auto-reopen it
    let bottomLatched = false;      // sticky Chambers once the page bottom is reached
    let hasScrolled = false;        // user has scrolled at least once — Gates opens on its own only after this

    // Glide the dot to the active stop immediately, then schedule its card open.
    function goToStop(stop) {
      if (stop !== activeStop) setActiveStop(stop); // dot glides to the current stop
      scheduleOpen(stop);
    }

    // Debounced accordion change, aimed at the *latest* target so a fast scroll
    // only opens the stop you land on. `target` is the stop to open, or null to
    // close everything (the clean state at the very top).
    function scheduleOpen(target) {
      if (target && target === suppressAutoOpenFor) { pendingOpen = undefined; clearTimeout(autoOpenTimer); return; }
      if (target !== suppressAutoOpenFor) suppressAutoOpenFor = null;
      if (openStop === target) { pendingOpen = undefined; clearTimeout(autoOpenTimer); return; }
      if (pendingOpen === target) return; // already counting down toward this target
      pendingOpen = target;
      clearTimeout(autoOpenTimer);
      autoOpenTimer = setTimeout(() => { pendingOpen = undefined; openAccordion(target); }, 160);
    }

    // Collapse a card instantly, no animation — used for the card leaving the
    // accordion. It's usually above the viewport, where an animated collapse
    // would just read as a jump.
    function collapseInstant(stop) {
      const expanded = stop.querySelector('.stop-expanded');
      expanded.style.transition = 'none';
      stop.classList.remove('open');
      stop.querySelector('.stop-trigger').setAttribute('aria-expanded', 'false');
      expanded.style.height = '0px';
      expanded.offsetHeight;          // commit before re-enabling transitions
      expanded.style.transition = ''; // restore the CSS transition for later taps
    }

    // Make `target` the single open card (or close all if null) while keeping
    // both the anchor stop and the dot visually steady through the layout change.
    // The previously open card (usually above us) collapses instantly; we then
    // compensate scroll by however far the anchor bullet moved, cancel that same
    // shift on the dot, and let it glide to the active bullet's settled spot.
    function openAccordion(target) {
      if (openStop === target) return;
      const prev = openStop;
      const anchor = (target || activeStop).querySelector('.bullet');

      const dotTop = parseFloat(getComputedStyle(trainDot).top) || 0;
      const before = anchor.getBoundingClientRect().top;

      if (prev) collapseInstant(prev);

      const shift = anchor.getBoundingClientRect().top - before; // < 0 if the collapse was above us
      if (shift) window.scrollBy(0, shift);

      trainDot.classList.remove('ready');
      trainDot.style.top = (dotTop + shift) + 'px';
      trainDot.offsetHeight; // snap instantly so the layout shift doesn't jump the dot
      trainDot.classList.add('ready');

      openStop = target;
      if (target) expandStop(target, null);
      moveDotToStop(activeStop); // glide to the (now settled) active bullet position
    }

    // Active stop is chosen by POSITION, not by which stop is most visible: the
    // train is "at" the last station whose bullet has reached the focus line
    // (the vertical center of the viewport). This is strictly ordered, so the
    // dot advances one stop at a time and never leapfrogs.
    //
    // Ends are pinned: Gates at the very top and Chambers at the bottom (latched
    // with hysteresis, because its opening card lengthens the page and would
    // otherwise bounce selection back to Canal). Gates' card stays closed on the
    // pristine first paint but opens once the user has scrolled, so returning to
    // the top after scrolling shows Gates open rather than closed.
    function chooseActiveStop() {
      if (Date.now() < observerLockedUntil) return; // tap owns selection briefly

      const focusLine = window.innerHeight / 2;
      const scrollBottom = window.scrollY + window.innerHeight;
      const docHeight = document.documentElement.scrollHeight;

      if (window.scrollY > 5) hasScrolled = true; // the user has engaged with the page

      if (scrollBottom >= docHeight - 5) bottomLatched = true;
      if (bottomLatched) {
        const cb = chambers.querySelector('.bullet').getBoundingClientRect().top;
        if (cb <= focusLine + 40) { goToStop(chambers); return; }
        bottomLatched = false; // scrolled back up past Chambers — hand control back
      }

      // At the very top Gates is active; closed on first paint, open once scrolled.
      if (window.scrollY <= 5) {
        if (activeStop !== gates) setActiveStop(gates);
        scheduleOpen(hasScrolled ? gates : null);
        return;
      }

      let reached = stopElements[0];
      for (const stop of stopElements) {
        const rect = stop.querySelector('.bullet').getBoundingClientRect();
        if (rect.top + rect.height / 2 <= focusLine) {
          reached = stop; // bullet is at/above the line — the train has reached it
        } else {
          break;           // stops are in document order; everything below is still ahead
        }
      }
      goToStop(reached);
    }

    // Re-evaluate when stops cross in/out of view; the per-frame scroll listener
    // below drives the fine-grained motion between those events.
    const observer = new IntersectionObserver(() => {
      chooseActiveStop();
    }, {
      threshold: [0, 0.5, 1.0]
    });

    stopElements.forEach(stop => observer.observe(stop));

    // The IntersectionObserver only fires when stops cross threshold boundaries,
    // which doesn't reliably catch the moment the user lands at the very bottom
    // of the page. A scroll listener throttled to one check per animation frame
    // covers that — still discrete (the dot only moves when activeStop changes),
    // not continuous tracking.
    let scrollFrame = null;
    window.addEventListener('scroll', () => {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(() => {
        scrollFrame = null;
        chooseActiveStop();
      });
    }, { passive: true });

    // ---------- LAYOUT-CHANGE RECALCULATION ----------
    // When a card finishes expanding or collapsing, bullets below it have
    // shifted vertically. Re-pin the dot to the active stop's current position.
    stopElements.forEach(stop => {
      const expanded = stop.querySelector('.stop-expanded');
      expanded.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'height' && e.target === expanded) {
          moveDotToStop(activeStop);
        }
      });
    });

    // ---------- SCROLL TO STOP ----------
    // When opening a card, bring the stop's bullet + label up near the top
    // of the viewport so the beginning of the card is visible right under
    // it. If another card is currently open above this stop, its
    // disappearing height has to be factored in so the final resting place
    // is correct — otherwise the new stop ends up too high after the
    // collapse animation finishes.
    function scrollStopToTop(stop) {
      const trigger = stop.querySelector('.stop-trigger');
      const rect = trigger.getBoundingClientRect();
      const offsetFromTop = 80; // breathing room above the bullet
      let targetScroll = window.scrollY + rect.top - offsetFromTop;

      if (openStop && openStop !== stop) {
        const openRect = openStop.getBoundingClientRect();
        if (openRect.top < rect.top) {
          const openExpanded = openStop.querySelector('.stop-expanded');
          // Subtract the height that's about to disappear above us.
          targetScroll -= openExpanded.scrollHeight;
        }
      }

      window.scrollTo({
        top: Math.max(0, targetScroll),
        behavior: 'smooth'
      });
    }

    // ---------- CLICK HANDLER ----------
    stopElements.forEach(stop => {
      const trigger = stop.querySelector('.stop-trigger');
      trigger.addEventListener('click', () => {
        if (isAnimating) return;

        // A tap takes over: cancel any scroll-scheduled auto-open and lock the
        // observer through the full scroll + animation window so a stray
        // intersection event doesn't yank the active stop back.
        clearTimeout(autoOpenTimer);
        pendingOpen = undefined;
        observerLockedUntil = Date.now() + 2500;
        setActiveStop(stop);

        if (openStop === stop) {
          // Tapping the already-open stop collapses it. No scroll. Remember the
          // choice so scrolling doesn't immediately auto-reopen the same card.
          suppressAutoOpenFor = stop;
          isAnimating = true;
          collapseStop(stop, () => {
            openStop = null;
            isAnimating = false;
          });
        } else if (openStop) {
          // Switching to a different stop: scroll first (the calculation
          // accounts for the collapsing card's height), then collapse + expand.
          suppressAutoOpenFor = null;
          isAnimating = true;
          scrollStopToTop(stop);
          const previousOpen = openStop;
          openStop = null;
          collapseStop(previousOpen, () => {
            expandStop(stop, () => {
              openStop = stop;
              isAnimating = false;
            });
          });
        } else {
          // Opening from a cold state: scroll + expand in parallel.
          suppressAutoOpenFor = null;
          isAnimating = true;
          scrollStopToTop(stop);
          expandStop(stop, () => {
            openStop = stop;
            isAnimating = false;
          });
        }
      });
    });

    // ---------- STEP 3 EXPAND / COLLAPSE (unchanged) ----------
    function expandStop(stop, callback) {
      const expanded = stop.querySelector('.stop-expanded');
      const trigger = stop.querySelector('.stop-trigger');

      stop.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');

      expanded.offsetHeight; // force reflow

      const naturalHeight = expanded.scrollHeight;
      expanded.style.height = naturalHeight + 'px';

      setTimeout(() => {
        if (stop.classList.contains('open')) {
          expanded.style.height = 'auto';
        }
        if (callback) callback();
      }, 600);
    }

    function collapseStop(stop, callback) {
      const expanded = stop.querySelector('.stop-expanded');
      const trigger = stop.querySelector('.stop-trigger');

      expanded.style.height = expanded.scrollHeight + 'px';
      expanded.offsetHeight; // force reflow

      stop.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
      expanded.style.height = '0px';

      setTimeout(() => {
        if (callback) callback();
      }, 600);
    }

    // ---------- WINDOW RESIZE ----------
    window.addEventListener('resize', () => {
      moveDotToStop(activeStop);
    });

    // ---------- "LOOK UP." — scroll-tied entrance ----------
    const bridge = document.querySelector('.bridge');
    let lookUpReached = false;

    function updateLookUpProgress() {
      if (lookUpReached) return;

      const bridgeRect = bridge.getBoundingClientRect();
      const viewportHeight = window.innerHeight;
      const bridgeHeight = bridgeRect.height;

      // 0 → bridge top sits at viewport bottom (just entering view from below)
      // 1 → bridge is centered in viewport (its top is half a viewport up,
      //     adjusted for the bridge's own height)
      const startY = viewportHeight;
      const endY = (viewportHeight - bridgeHeight) / 2;

      let progress = (startY - bridgeRect.top) / (startY - endY);
      progress = Math.max(0, Math.min(1, progress));

      // Spec is explicit: "once you've looked up, you've looked up."
      // Lock at 1 so scrolling back through the bridge doesn't reverse the text.
      if (progress >= 1) lookUpReached = true;

      bridge.style.setProperty('--look-up-progress', progress);
    }

    // 21 thresholds (every 5%) for fine-grained discrete updates as the bridge
    // moves through the viewport. The CSS transitions fill the gaps smoothly.
    const lookUpObserver = new IntersectionObserver(() => {
      updateLookUpProgress();
    }, {
      threshold: Array.from({ length: 21 }, (_, i) => i / 20)
    });
    lookUpObserver.observe(bridge);

    // Set initial state synchronously (transitions not yet enabled, so this is
    // instant), then enable transitions on the next frame so future updates animate.
    updateLookUpProgress();
    requestAnimationFrame(() => {
      bridge.classList.add('lookup-ready');
    });
  </script>

    const info = spotInfo[stopEl.dataset.stop];
    if (!info) return;
    stopEl.querySelectorAll('.rec').forEach((rec) => {
      const tagEl = rec.querySelector('.tag');
      if (!tagEl) return;
      const matchKey = Object.keys(info).find((k) => norm(k) === norm(tagEl.textContent));
      if (!matchKey) return;
      const data = info[matchKey];
      const mapUrl = data.url
        || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(data.addr || `${data.place}, New York, NY`);

      tagEl.insertAdjacentHTML('beforeend', `<span class="rec-chevron">›</span>`);

      const detail = document.createElement('div');
      detail.className = 'rec-detail';
      detail.innerHTML = `
        <div class="rec-detail-inner">
          <div class="rec-where">${pinSVG}<span>${data.area}</span></div>
          <div class="rec-actions">
            <a class="rec-action" target="_blank" rel="noopener"
               href="${mapUrl}">View map ↗</a>
          </div>
        </div>`;
      rec.appendChild(detail);

      rec.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        const open = rec.classList.toggle('rec-open');
        detail.style.height = open ? detail.firstElementChild.scrollHeight + 'px' : '0px';
      });
    });
  });
})();
</script>

</body>
</html>
